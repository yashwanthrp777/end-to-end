services:
  # Nginx Gateway Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cloudcart-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # React SPA Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudcart-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  # Express REST API Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudcart-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    expose:
      - "5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://cloudcart:cloudcart_secret@postgres:5432/cloudcart_db
      JWT_SECRET: super_secret_cloudcart_jwt_key_2026_xYz987!
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: cloudcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudcart
      POSTGRES_PASSWORD: cloudcart_secret
      POSTGRES_DB: cloudcart_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcart -d cloudcart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
