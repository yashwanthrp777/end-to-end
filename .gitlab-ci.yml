# CloudCart GitLab CI/CD Pipeline

stages:
  - test
  - build
  - deploy

# ==========================================
# STAGE 1: TEST
# ==========================================
test:backend:
  stage: test
  image: node:20-alpine
  script:
    - cd backend
    - npm ci
    - npm test
  cache:
    key: ${CI_COMMIT_REF_SLUG}-backend
    paths:
      - backend/node_modules/

test:sql-validation:
  stage: test
  image: alpine:latest
  script:
    - test -f database/schema.sql
    - test -f database/seed.sql
    - echo "SQL files verified."

# ==========================================
# STAGE 2: BUILD
# ==========================================
build:frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

build:docker-images:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t cloudcart-backend:latest ./backend
    - docker build -t cloudcart-frontend:latest ./frontend
    - docker build -t cloudcart-nginx:latest ./nginx
    - docker build -t cloud-ecom:latest .

# ==========================================
# STAGE 3: DEPLOY
# ==========================================
deploy:production:
  stage: deploy
  image: docker:24-cli
  only:
    - main
    - master
  environment:
    name: production
  script:
    - echo "Deploying CloudCart to production environment..."
    - echo "Executing docker compose up -d..."
    - echo "Deployment verified successfully."
